services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lunarcv-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - API_KEY=${API_KEY:-}
      - PUBLIC_MODE=${PUBLIC_MODE:-false}
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    command: uv run --frozen uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    restart: unless-stopped
    networks:
      - lunarcv-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lunarcv-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - lunarcv-network

networks:
  lunarcv-network:
    driver: bridge
