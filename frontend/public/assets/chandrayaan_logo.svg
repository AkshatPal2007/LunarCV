<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="chMoon" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#1e1338" />
    </radialGradient>
    <linearGradient id="chOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="chGlow">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Ring with Stars -->
  <circle cx="80" cy="80" r="76" fill="#070414" stroke="#8a6bff" stroke-width="2" />
  <circle cx="80" cy="80" r="72" fill="none" stroke="rgba(255,255,255,0.15)" stroke-dasharray="2 3" />

  <!-- Moon Crescent / Orb -->
  <circle cx="80" cy="80" r="42" fill="url(#chMoon)" filter="url(#chGlow)" />
  <circle cx="70" cy="72" r="8" fill="#130b24" opacity="0.35" />
  <circle cx="92" cy="88" r="6" fill="#130b24" opacity="0.3" />
  <circle cx="68" cy="94" r="5" fill="#130b24" opacity="0.25" />

  <!-- Elliptical Orbit Trajectory -->
  <ellipse cx="80" cy="80" rx="64" ry="24" fill="none" stroke="url(#chOrbit)" stroke-width="3" transform="rotate(-30 80 80)" filter="url(#chGlow)" />

  <!-- Chandrayaan Satellite Craft -->
  <g transform="translate(126, 52) rotate(15)">
    <!-- Solar Panels -->
    <rect x="-14" y="-3" width="9" height="6" rx="1" fill="#38bdf8" stroke="#ffffff" stroke-width="0.5" />
    <rect x="5" y="-3" width="9" height="6" rx="1" fill="#38bdf8" stroke="#ffffff" stroke-width="0.5" />
    <!-- Bus -->
    <rect x="-5" y="-5" width="10" height="10" rx="1.5" fill="#ffffff" stroke="#fbbf24" stroke-width="1" />
    <!-- Dish -->
    <circle cx="0" cy="0" r="2.5" fill="#fbbf24" />
  </g>

  <!-- Tricolor Arc Accent -->
  <path d="M 22 80 A 58 58 0 0 1 138 80" fill="none" stroke="#ff9933" stroke-width="1.8" opacity="0.8" />
  <path d="M 24 83 A 56 56 0 0 1 136 83" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.9" />
  <path d="M 26 86 A 54 54 0 0 1 134 86" fill="none" stroke="#138808" stroke-width="1.8" opacity="0.8" />

  <!-- Label Badge -->
  <text x="80" y="142" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9" letter-spacing="1">CHANDRAYAAN</text>
  <text x="80" y="152" text-anchor="middle" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="7.5" letter-spacing="1.5">ISRO MISSION</text>
</svg>
