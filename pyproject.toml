[project]
name = "lunarcv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "opencv-contrib-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.3",
    "rasterio>=1.4.4",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4", "PT", "SIM"]
ignore = ["E501"]  # Ignore line length for now

[tool.ruff.lint.per-file-ignores]
# Test files often have unused variables (checking exceptions, etc.)
"tests/**/*.py" = ["F841", "S101", "S105", "S106", "S107", "S311", "BLE001", "PLR2004"]
"*/tests/**/*.py" = ["F841", "S101", "S105", "S106", "S107", "S311", "BLE001", "PLR2004"]
