services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lunarcv-backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - model-cache:/root/.cache/torch
    environment:
      - PYTHONUNBUFFERED=1
      - API_KEY=${API_KEY:-}
      - PUBLIC_MODE=${PUBLIC_MODE:-false}
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:80"]
    restart: unless-stopped
    networks:
      - lunarcv-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lunarcv-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - lunarcv-network

volumes:
  model-cache:

networks:
  lunarcv-network:
    driver: bridge
